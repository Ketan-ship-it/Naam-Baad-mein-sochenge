spring:
  application:
    name: User-Service

  datasource:
    url: jdbc:postgresql://localhost:5438/users
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  flyway:
    url: jdbc:postgresql://localhost:5438/users
    user: postgres
    password: password
    locations: classpath:db/migration
    baseline-on-migrate: true
    enabled: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 
            client-secret: 

server:
  port: 9010
  servlet:
    context-path: /users

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

deploy.env: "development"



